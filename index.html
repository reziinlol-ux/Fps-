<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#9fd3ff" />
<title>Pill FPS</title>
<style>
  :root {
    --ring: rgba(255, 255, 255, 0.35);
    --knob: rgba(255, 255, 255, 0.55);
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1020;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  canvas#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .ui { position: fixed; inset: 0; pointer-events: none; }

  /* Joystick */
  #stickIdle, #base, #knob {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #stickIdle {
    width: 150px; height: 150px;
    border: 3px dashed var(--ring);
    background: rgba(255, 255, 255, 0.05);
  }
  #base {
    display: none;
    width: 150px; height: 150px;
    border: 3px solid var(--ring);
    background: rgba(255, 255, 255, 0.10);
  }
  #knob {
    display: none;
    width: 66px; height: 66px;
    background: var(--knob);
    border: 2px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
  }

  /* Sprung-Knopf unten rechts */
  #jump {
    position: fixed;
    right: calc(36px + env(safe-area-inset-right));
    bottom: calc(36px + env(safe-area-inset-bottom));
    width: 104px; height: 104px;
    border-radius: 50%;
    border: 3px solid var(--ring);
    background: rgba(255, 255, 255, 0.14);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; letter-spacing: 0.06em;
    pointer-events: none;
    box-sizing: border-box;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
  }
  #jump.down { background: rgba(255, 255, 255, 0.42); }

  #view {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top));
    right: calc(24px + env(safe-area-inset-right));
    padding: 10px 16px;
    border-radius: 999px;
    border: 2px solid var(--ring);
    background: rgba(0, 0, 0, 0.35);
    font-size: 14px;
    font-weight: 600;
    pointer-events: none;
    box-sizing: border-box;
  }
  #crosshair {
    position: absolute;
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
  }

  #start {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
    background: rgba(5, 8, 18, 0.5);
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #start.hidden { opacity: 0; }
  #start h1 { margin: 0 0 14px; font-size: clamp(28px, 5vw, 44px); }
  #start p { margin: 6px 0; font-size: clamp(14px, 2.4vw, 18px); opacity: 0.9; }
  #start .go {
    margin-top: 20px;
    padding: 14px 28px;
    border-radius: 999px;
    background: #fff;
    color: #0b1020;
    font-weight: 700;
    font-size: 18px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="ui">
  <div id="stickIdle"></div>
  <div id="base"></div>
  <div id="knob"></div>
  <div id="crosshair"></div>
</div>

<div id="jump">SPRUNG</div>
<div id="view">Ansicht: 3. Person</div>

<div id="start">
  <h1>Pill FPS</h1>
  <p>Links (1/3 des Bildschirms) irgendwo ziehen = laufen</p>
  <p>Rechts (2/3) ziehen = umschauen</p>
  <p>Unten rechts = springen</p>
  <p>Oben rechts = Ansicht wechseln (1. / 3. Person)</p>
  <div class="go">Zum Starten tippen</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------------------------------------------------------------
// Einstellungen
// ---------------------------------------------------------------
const PLAYER = {
  radius: 0.35,     // Pill: Radius
  height: 1.8,      // Pill: Gesamthoehe (Fuss bis Kopf)
  eye: 1.62,        // Kamera-Hoehe ueber den Fuessen
  speed: 5.5,       // m/s
  jumpSpeed: 7.6,   // Anfangsgeschwindigkeit beim Sprung
  gravity: -22,     // m/s^2
};
const STICK_MAX = 70;       // Pixel, ab hier ist der Stick voll ausgelenkt
const STICK_DEAD = 0.12;    // Totzone
const LOOK_SENS = 0.0042;   // Rad pro Pixel
const JUMP_BUFFER = 0.15;   // Sekunden, damit ein kurzer Tipp nicht verloren geht
const WORLD = 50;           // halbe Kantenlaenge der Spielflaeche
const H = PLAYER.height, R = PLAYER.radius;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = id => document.getElementById(id);

const canvas = $('game');
const baseEl = $('base');
const knobEl = $('knob');
const idleEl = $('stickIdle');
const jumpEl = $('jump');
const startEl = $('start');

// ---------------------------------------------------------------
// Three.js Grundaufbau
// ---------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);
scene.fog = new THREE.Fog(0x9fd3ff, 35, 140);

const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 400);
camera.rotation.order = 'YXZ';   // erst Blick links/rechts, dann hoch/runter

scene.add(new THREE.HemisphereLight(0xffffff, 0x4a5a3a, 1.1));

const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 120 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
scene.add(sun.target);

// Boden mit Gitter-Textur, damit man Bewegung gut sieht
function makeGridTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#7fae6a';
  g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(255,255,255,0.35)';
  g.lineWidth = 3;
  g.strokeRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(25, 25);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD * 2, WORLD * 2),
  new THREE.MeshStandardMaterial({ map: makeGridTexture(), roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ---------------------------------------------------------------
// Level: Kisten, Treppe, Plattformen, Waende
// Jede Box ist zugleich Kollisionsobjekt (AABB, Boden liegt bei y=0)
// ---------------------------------------------------------------
const solids = [];
function addBox(cx, cz, sx, h, sz, color) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, h, sz),
    new THREE.MeshStandardMaterial({ color, roughness: 0.75 })
  );
  mesh.position.set(cx, h / 2, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  solids.push({
    minX: cx - sx / 2, maxX: cx + sx / 2,
    minZ: cz - sz / 2, maxZ: cz + sz / 2,
    minY: 0, maxY: h,
  });
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Waende
const WALL_H = 6, WALL_T = 2;
addBox(0, -WORLD, WORLD * 2 + WALL_T, WALL_H, WALL_T, 0x555b66);
addBox(0,  WORLD, WORLD * 2 + WALL_T, WALL_H, WALL_T, 0x555b66);
addBox(-WORLD, 0, WALL_T, WALL_H, WORLD * 2 + WALL_T, 0x555b66);
addBox( WORLD, 0, WALL_T, WALL_H, WORLD * 2 + WALL_T, 0x555b66);

// Treppe
addBox(8,  -8, 4, 0.6, 4, 0xd08a5a);
addBox(12, -8, 4, 1.2, 4, 0xd08a5a);
addBox(16, -8, 4, 1.8, 4, 0xd08a5a);
addBox(20, -8, 4, 2.4, 4, 0xd08a5a);

// Plattformen
addBox(-14, -12, 8, 3, 8, 0x5a8fd0);
addBox(-8, 10, 6, 1.1, 3, 0x9a6fd0);
addBox(-18, 14, 3, 4.5, 3, 0x7fd0b0);
addBox(0, 16, 14, 1.6, 1.4, 0xbbbbbb);

// Saeulen im Kreis
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  addBox(Math.cos(a) * 26, Math.sin(a) * 26, 1.6, 5, 1.6, 0xeeeeee);
}

// Zufaellige Kisten (fester Seed = immer gleiche Map), Spawn bleibt frei
const rng = mulberry32(42);
for (let i = 0; i < 45; i++) {
  const x = (rng() * 2 - 1) * (WORLD - 4);
  const z = (rng() * 2 - 1) * (WORLD - 4);
  if (Math.hypot(x, z) < 6) continue;
  const s = 1 + rng() * 1.6;
  const color = new THREE.Color().setHSL(rng(), 0.45, 0.55).getHex();
  addBox(x, z, s, s * (0.6 + rng() * 0.6), s, color);
}

// ---------------------------------------------------------------
// Spieler (Pill = Kapsel-Kollision: Radius R, Hoehe H)
// ---------------------------------------------------------------
const player = {
  x: 0, y: 0, z: 10,   // y = Fuesse
  vy: 0,
  grounded: false,
  yaw: 0,              // Blickrichtung links/rechts
  pitch: 0,            // Blickrichtung hoch/runter
  jumpBuf: 0,
};

// Kreis (Pill von oben gesehen) gegen Box in der XZ-Ebene
function circleTouchesBox(p, b) {
  const cx = clamp(p.x, b.minX, b.maxX);
  const cz = clamp(p.z, b.minZ, b.maxZ);
  const dx = p.x - cx, dz = p.z - cz;
  return dx * dx + dz * dz <= R * R + 1e-4;
}

// Seitliche Kollision: Pill wird aus Boxen herausgeschoben
function resolveHorizontal(p) {
  for (const b of solids) {
    if (p.y >= b.maxY - 0.01) continue;           // wir stehen ueber der Box
    const cx = clamp(p.x, b.minX, b.maxX);
    const cz = clamp(p.z, b.minZ, b.maxZ);
    const dx = p.x - cx, dz = p.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 >= R * R) continue;
    if (d2 > 1e-8) {
      const d = Math.sqrt(d2);
      const push = (R - d) / d;
      p.x += dx * push;
      p.z += dz * push;
    } else {
      // Mittelpunkt steckt in der Box: kuerzeste Seite waehlen
      const left = p.x - b.minX, right = b.maxX - p.x;
      const back = p.z - b.minZ, front = b.maxZ - p.z;
      const m = Math.min(left, right, back, front);
      if (m === left) p.x = b.minX - R;
      else if (m === right) p.x = b.maxX + R;
      else if (m === back) p.z = b.minZ - R;
      else p.z = b.maxZ + R;
    }
  }
}

// ---------------------------------------------------------------
// Soldat: prozedurales Modell fuer die 3. Person, Arme und Gewehr fuer die 1. Person
// ---------------------------------------------------------------
function makeCamoTexture(base, blobs, seed) {
  const rand = mulberry32(seed);
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base;
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 90; i++) {
    g.fillStyle = blobs[Math.floor(rand() * blobs.length)];
    const x = rand() * 256, y = rand() * 256;
    const rx = 14 + rand() * 34, ry = 10 + rand() * 26, rot = rand() * Math.PI;
    // Flecken an den Raendern umbrechen, damit die Textur nahtlos kachelt
    for (const dx of [-256, 0, 256]) for (const dy of [-256, 0, 256]) {
      g.beginPath();
      g.ellipse(x + dx, y + dy, rx, ry, rot, 0, Math.PI * 2);
      g.fill();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const M = {
  camo:   new THREE.MeshStandardMaterial({ map: makeCamoTexture('#4d5a3a', ['#2c3721', '#6e6a48', '#3b3322', '#8f8259'], 11), roughness: 0.9 }),
  helmet: new THREE.MeshStandardMaterial({ color: 0x3f4b2c, roughness: 0.45, metalness: 0.15 }),
  vest:   new THREE.MeshStandardMaterial({ color: 0x23281d, roughness: 0.85 }),
  gear:   new THREE.MeshStandardMaterial({ color: 0x33372a, roughness: 0.8 }),
  glove:  new THREE.MeshStandardMaterial({ color: 0x6b5a40, roughness: 0.9 }),
  face:   new THREE.MeshStandardMaterial({ color: 0x7a6a4d, roughness: 0.95 }),
  boot:   new THREE.MeshStandardMaterial({ color: 0x17130f, roughness: 0.7 }),
  lens:   new THREE.MeshStandardMaterial({ color: 0x0b1620, roughness: 0.15, metalness: 0.4 }),
  metal:  new THREE.MeshStandardMaterial({ color: 0x1d1f21, roughness: 0.35, metalness: 0.7 }),
  stock:  new THREE.MeshStandardMaterial({ color: 0x4a3a26, roughness: 0.7 }),
};

const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);

// Teil erzeugen und an ein Elternobjekt haengen (wirft Schatten)
function part(geo, mat, parent, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// Walze zwischen zwei Punkten (fuer Arme in der 1. Person)
function limb(a, b, r, mat, parent) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 12), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  parent.add(m);
  return m;
}

// Gewehr (Lauf zeigt nach -z, Griff bei z = 0.07, Schaft nach hinten)
function buildRifle() {
  const g = new THREE.Group();
  part(box(0.07, 0.1, 0.34), M.metal, g, 0, 0, -0.05);            // Receiver
  part(box(0.06, 0.07, 0.24), M.metal, g, 0, 0.01, -0.36);         // Handguard
  part(new THREE.CylinderGeometry(0.011, 0.011, 0.3, 10), M.metal, g, 0, 0.01, -0.62).rotation.x = Math.PI / 2;
  part(box(0.04, 0.04, 0.04), M.metal, g, 0, 0.01, -0.78);         // Muendung
  part(box(0.045, 0.16, 0.07), M.metal, g, 0, -0.12, -0.1).rotation.x = -0.2;   // Magazin
  part(box(0.04, 0.11, 0.05), M.stock, g, 0, -0.1, 0.07).rotation.x = -0.3;     // Pistolengriff
  part(box(0.05, 0.1, 0.26), M.stock, g, 0, -0.01, 0.27);          // Schaft
  part(box(0.035, 0.04, 0.12), M.metal, g, 0, 0.08, -0.08);        // Optik-Basis
  part(new THREE.CylinderGeometry(0.022, 0.022, 0.14, 12), M.metal, g, 0, 0.12, -0.08).rotation.x = Math.PI / 2;
  return g;
}

// Soldat (3. Person): Huefte bei 0.99 m, Fuesse bei y = 0
const soldier = { root: null, hips: null, torso: null, head: null, legs: {}, arms: {}, phase: 0, walk: 0, air: 0 };

function buildSoldier() {
  const root = new THREE.Group();

  const hips = new THREE.Group();
  hips.position.y = 0.99;
  root.add(hips);
  part(box(0.34, 0.16, 0.2), M.camo, hips);
  part(box(0.37, 0.05, 0.23), M.gear, hips, 0, 0.07, 0);           // Guertel

  for (const side of [-1, 1]) {
    const hip = new THREE.Group();
    hip.position.set(0.1 * side, 0, 0);
    hips.add(hip);
    part(box(0.15, 0.44, 0.16), M.camo, hip, 0, -0.22, 0);         // Oberschenkel
    const knee = new THREE.Group();
    knee.position.y = -0.44;
    hip.add(knee);
    part(box(0.14, 0.42, 0.15), M.camo, knee, 0, -0.21, 0);        // Unterschenkel
    part(box(0.16, 0.13, 0.27), M.boot, knee, 0, -0.485, -0.04);   // Stiefel
    soldier.legs[side] = { hip, knee };
  }

  const torso = new THREE.Group();
  torso.position.y = 1.05;
  torso.rotation.order = 'YXZ';
  root.add(torso);
  part(box(0.36, 0.46, 0.22), M.camo, torso, 0, 0.25, 0);          // Oberkoerper
  part(box(0.42, 0.42, 0.27), M.vest, torso, 0, 0.27, -0.01);      // Plattentraeger
  for (const x of [-0.12, 0, 0.12]) part(box(0.09, 0.12, 0.05), M.gear, torso, x, 0.3, -0.155); // Magazintaschen
  part(box(0.08, 0.13, 0.06), M.gear, torso, 0.16, 0.1, -0.16);    // Taschen rechts
  part(new THREE.CylinderGeometry(0.05, 0.055, 0.1, 12), M.face, torso, 0, 0.5, 0); // Hals

  const head = new THREE.Group();
  head.position.y = 0.55;
  torso.add(head);
  part(new THREE.SphereGeometry(0.105, 20, 16), M.face, head).scale.set(0.95, 1.1, 0.95);
  part(new THREE.SphereGeometry(0.145, 28, 18, 0, Math.PI * 2, 0, Math.PI * 0.55), M.helmet, head, 0, 0.04, 0)
    .scale.set(1.06, 0.9, 1.1);                                    // Helm
  part(box(0.16, 0.035, 0.035), M.gear, head, 0, 0.03, -0.1);     // Brillenrahmen
  for (const x of [-0.05, 0.05]) {
    part(new THREE.SphereGeometry(0.03, 12, 10), M.lens, head, x, 0.03, -0.1).scale.set(1.2, 1, 0.6);
  }
  part(box(0.13, 0.07, 0.04), M.face, head, 0, -0.05, -0.1);      // Gesichtstuch

  for (const side of [-1, 1]) {
    const shoulder = new THREE.Group();
    shoulder.position.set(0.245 * side, 0.4, 0);
    shoulder.rotation.order = 'YXZ';
    torso.add(shoulder);
    part(new THREE.SphereGeometry(0.058, 12, 10), M.camo, shoulder);
    part(box(0.11, 0.3, 0.11), M.camo, shoulder, 0, -0.15, 0);    // Oberarm
    const elbow = new THREE.Group();
    elbow.position.y = -0.3;
    shoulder.add(elbow);
    part(box(0.1, 0.28, 0.1), M.camo, elbow, 0, -0.14, 0);        // Unterarm
    part(box(0.095, 0.11, 0.13), M.glove, elbow, 0, -0.33, 0);    // Hand
    soldier.arms[side] = { shoulder, elbow };
  }

  const rifle = buildRifle();
  rifle.position.set(0, 0.31, -0.19);
  torso.add(rifle);

  soldier.root = root;
  soldier.hips = hips;
  soldier.torso = torso;
  soldier.head = head;
  scene.add(root);
}
buildSoldier();

// 1. Person: Arme und Gewehr haengen an der Kamera
const viewModel = new THREE.Group();
scene.add(camera);
camera.add(viewModel);

const vmRifle = buildRifle();
vmRifle.scale.setScalar(0.75);
vmRifle.position.set(0.18, -0.2, -0.5);
viewModel.add(vmRifle);

const vmArms = [
  { s: [0.36, -0.45, 0.05], e: [0.42, -0.52, -0.12], h: [0.18, -0.275, -0.45] },  // rechte Hand am Griff
  { s: [-0.32, -0.45, 0.05], e: [-0.26, -0.55, -0.3], h: [0.18, -0.19, -0.77] },  // linke Hand am Handguard
];
for (const a of vmArms) {
  const S = new THREE.Vector3(...a.s), E = new THREE.Vector3(...a.e), H = new THREE.Vector3(...a.h);
  limb(S, E, 0.042, M.camo, viewModel);
  limb(E, H, 0.038, M.camo, viewModel);
  part(new THREE.SphereGeometry(0.045, 12, 10), M.glove, viewModel, a.h[0], a.h[1], a.h[2]);
}
viewModel.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });

// Kameraansicht: false = 1. Person, true = 3. Person
let thirdPerson = false;
const viewEl = $('view');

function toggleView() {
  thirdPerson = !thirdPerson;
  viewEl.textContent = thirdPerson ? 'Ansicht: 1. Person' : 'Ansicht: 3. Person';
}

function insideSolid(x, y, z) {
  for (const b of solids) {
    if (x > b.minX && x < b.maxX && z > b.minZ && z < b.maxZ && y > b.minY && y < b.maxY) return true;
  }
  return false;
}

// Kamera nicht durch Waende schieben: vom Ziel aus Richtung Kamera pruefen
function clampCamera(from, to) {
  const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
  const n = 24;
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    if (insideSolid(from.x + dx * t, from.y + dy * t, from.z + dz * t)) {
      const t2 = Math.max(0, (i - 1) / n);
      return new THREE.Vector3(from.x + dx * t2, from.y + dy * t2, from.z + dz * t2);
    }
  }
  return to;
}

function updateCamera() {
  soldier.root.visible = thirdPerson;
  viewModel.visible = !thirdPerson;

  if (!thirdPerson) {
    camera.position.set(player.x, player.y + PLAYER.eye, player.z);
    camera.rotation.set(player.pitch, player.yaw, 0);
    return;
  }

  // Blickrichtung und Schulter-Versatz (ueber die rechte Schulter)
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  const dx = -sy * cp, dy = sp, dz = -cy * cp;
  const rx = cy * 0.55, rz = -sy * 0.55;
  const pivot = new THREE.Vector3(player.x, player.y + 1.45, player.z);
  const want = new THREE.Vector3(pivot.x - dx * 2.6 + rx, pivot.y - dy * 2.6 + 0.15, pivot.z - dz * 2.6 + rz);
  camera.position.copy(clampCamera(pivot, want));
  camera.lookAt(pivot.x + dx * 8 + rx, pivot.y + dy * 8, pivot.z + dz * 8 + rz);
}

// Soldat animieren: Gehen, Springen, Zielhaltung, Blick nach oben/unten
let soldierClock = 0;
function updateCharacter(dt, wx, wz) {
  soldierClock += dt;
  const s = soldier;
  const moving = player.grounded && Math.hypot(wx, wz) > 0.1 ? 1 : 0;
  s.walk += (moving - s.walk) * Math.min(1, dt * 10);
  s.air += ((player.grounded ? 0 : 1) - s.air) * Math.min(1, dt * 12);
  s.phase += dt * 11 * s.walk;
  const swing = Math.sin(s.phase) * s.walk;

  s.root.position.set(player.x, player.y, player.z);
  s.root.rotation.y = player.yaw;

  // Beine: gegenlaeufig, Knie beugen sich beim Vorschwingen; in der Luft angewinkelt
  for (const side of [-1, 1]) {
    const L = s.legs[side];
    const sw = side === -1 ? swing : -swing;
    const hipWalk = sw * 0.55;
    const kneeWalk = -Math.max(0, hipWalk) * 0.9;
    L.hip.rotation.x = hipWalk * (1 - s.air) + 0.5 * s.air;
    L.knee.rotation.x = kneeWalk * (1 - s.air) - 0.8 * s.air;
  }

  // Arme: Zielhaltung mit dem Gewehr, leichtes Mitschwingen beim Gehen
  for (const side of [-1, 1]) {
    const A = s.arms[side];
    A.shoulder.rotation.set(1.3 + swing * 0.03, 0.42 * side, 0);
    A.elbow.rotation.set(0.3, 0, 0);
  }

  // Oberkoerper und Kopf folgen dem Blick nach oben/unten
  s.torso.rotation.x = THREE.MathUtils.clamp(player.pitch * 0.25, -0.35, 0.35);
  s.head.rotation.x = THREE.MathUtils.clamp(player.pitch * 0.6 - s.torso.rotation.x, -0.7, 0.7);

  // 1. Person: Waffe wackelt leicht beim Gehen, sonst Atmen
  const bobX = Math.sin(s.phase) * 0.012 * s.walk;
  const bobY = -Math.abs(Math.sin(s.phase)) * 0.012 * s.walk + Math.sin(soldierClock * 1.6) * 0.003;
  viewModel.position.set(bobX, bobY, 0);
}

// ---------------------------------------------------------------
// Eingabe
// ---------------------------------------------------------------
const stick = { x: 0, y: 0 };      // Stick-Ausschlag, y = vorwaerts
const keys = new Set();
const pointers = new Map();        // pointerId -> { role, ... }
let started = false;

function startGame() {
  if (started) return;
  started = true;
  startEl.classList.add('hidden');
}

function inEl(el, x, y, pad = 0) {
  const r = el.getBoundingClientRect();
  return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
}

function inJumpZone(x, y) {
  const r = jumpEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  return Math.hypot(x - cx, y - cy) <= r.width / 2 + 24;
}

// Linkes Drittel = Laufen, der Rest = Umschauen
function zoneOf(x) {
  return x < window.innerWidth / 3 ? 'move' : 'look';
}

function setStickVisible(on) {
  baseEl.style.display = on ? 'block' : 'none';
  knobEl.style.display = on ? 'block' : 'none';
  idleEl.style.display = on ? 'none' : 'block';
}

function updateStick(p) {
  const dx = p.x - p.ox, dy = p.y - p.oy;
  const dist = Math.min(Math.hypot(dx, dy), STICK_MAX);
  const ang = Math.atan2(dy, dx);
  const kx = Math.cos(ang) * dist, ky = Math.sin(ang) * dist;

  baseEl.style.left = p.ox + 'px';
  baseEl.style.top = p.oy + 'px';
  knobEl.style.left = (p.ox + kx) + 'px';
  knobEl.style.top = (p.oy + ky) + 'px';

  let m = dist / STICK_MAX;
  m = m < STICK_DEAD ? 0 : (m - STICK_DEAD) / (1 - STICK_DEAD);
  stick.x = Math.cos(ang) * m;
  stick.y = -Math.sin(ang) * m;   // nach oben = vorwaerts
}

function activeStickPointer() {
  for (const p of pointers.values()) if (p.role === 'move') return p;
  return null;
}

window.addEventListener('pointerdown', e => {
  e.preventDefault();
  startGame();

  if (inEl(viewEl, e.clientX, e.clientY, 12)) {
    pointers.set(e.pointerId, { role: 'button' });
    toggleView();
    return;
  }

  if (inJumpZone(e.clientX, e.clientY)) {
    pointers.set(e.pointerId, { role: 'jump' });
    jumpEl.classList.add('down');
    player.jumpBuf = JUMP_BUFFER;
    return;
  }

  if (zoneOf(e.clientX) === 'move') {
    const p = { role: 'move', ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, p);
    setStickVisible(true);
    updateStick(p);
  } else {
    pointers.set(e.pointerId, { role: 'look', x: e.clientX, y: e.clientY });
  }
});

window.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  if (p.role === 'move') {
    p.x = e.clientX;
    p.y = e.clientY;
    updateStick(p);
  } else if (p.role === 'look') {
    player.yaw -= (e.clientX - p.x) * LOOK_SENS;
    player.pitch = clamp(player.pitch - (e.clientY - p.y) * LOOK_SENS, -1.45, 1.45);
    p.x = e.clientX;
    p.y = e.clientY;
  }
});

function endPointer(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);

  if (p.role === 'jump') {
    jumpEl.classList.remove('down');
  } else if (p.role === 'move') {
    const other = activeStickPointer();
    if (other) {
      updateStick(other);
    } else {
      stick.x = 0;
      stick.y = 0;
      setStickVisible(false);
    }
  }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

// Tastatur (zum Testen am Rechner)
window.addEventListener('keydown', e => {
  startGame();
  keys.add(e.code);
  if (e.code === 'KeyV' && !e.repeat) toggleView();
  if (e.code === 'Space') {
    player.jumpBuf = JUMP_BUFFER;
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); stick.x = stick.y = 0; });

// iPad: kein Scrollen, Zoomen oder Kontextmenue
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------
// Layout
// ---------------------------------------------------------------
function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  // Ruhe-Anzeige des Sticks unten links
  idleEl.style.left = Math.max(100, w / 6) + 'px';
  idleEl.style.top = (h - Math.max(110, h * 0.22)) + 'px';
}
window.addEventListener('resize', layout);
layout();

// ---------------------------------------------------------------
// Update: Bewegung, Schwerkraft, Kamera
// ---------------------------------------------------------------

function update(dt) {
  // Eingabe: Stick + Tastatur, Laenge auf 1 begrenzen
  let mx = stick.x, my = stick.y;
  if (keys.has('KeyW') || keys.has('ArrowUp')) my += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) my -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mx -= 1;
  const len = Math.hypot(mx, my);
  if (len > 1) { mx /= len; my /= len; }

  // Vorwaerts/Rechts aus der Blickrichtung (nur Yaw)
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const fx = -sy, fz = -cy;
  const rx = cy, rz = -sy;
  const wx = fx * my + rx * mx;
  const wz = fz * my + rz * mx;

  // Horizontal bewegen und an Waenden abprallen lassen
  player.x += wx * PLAYER.speed * dt;
  player.z += wz * PLAYER.speed * dt;
  resolveHorizontal(player);

  // Sprung (mit kleinem Puffer, damit der Tipp nicht verloren geht)
  player.jumpBuf = Math.max(0, player.jumpBuf - dt);
  if (player.jumpBuf > 0 && player.grounded) {
    player.vy = PLAYER.jumpSpeed;
    player.grounded = false;
    player.jumpBuf = 0;
  }

  // Schwerkraft
  const prevY = player.y;
  player.vy += PLAYER.gravity * dt;
  player.y += player.vy * dt;

  // Boden: Hoechster Block unter der Pill, auf den wir gerade gefallen sind
  let support = 0;
  for (const b of solids) {
    if (!circleTouchesBox(player, b)) continue;
    if (b.maxY <= prevY + 0.05 && b.maxY > support) support = b.maxY;
  }
  if (player.y <= support) {
    player.y = support;
    if (player.vy < 0) player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  // Soldat und Kamera
  updateCharacter(dt, wx, wz);
  updateCamera();

  // Sonne folgt dem Spieler, damit Schatten ueberall da sind
  sun.position.set(player.x + 20, 40, player.z + 15);
  sun.target.position.set(player.x, 0, player.z);
  sun.target.updateMatrixWorld();
}

// ---------------------------------------------------------------
// Schleife
// ---------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
